# =============================================================================
# render.yaml — Render Blueprint for AI Verify (ht-ai-verify)
# =============================================================================
# One always-on Node web service (worker console + hosted collection flow +
# API) and one managed Postgres. Carried over from ht-ai-care-coordinator's
# blueprint, which was itself reduced from ht-cre's CRE blueprint.
#
# Secrets (sync: false) are entered in the dashboard / via the API — never here.
# The first deployment copied them from the ht-cre services (OpenAI, Twilio,
# Argyle sandbox, CLEAR sandbox).
# =============================================================================

databases:
  - name: ht-ai-verify-db
    databaseName: ai_verify
    user: ai_verify
    region: oregon
    plan: basic_256mb # the workspace's one free Postgres is taken (care-coordinator); smallest paid tier

services:
  - type: web
    name: ht-ai-verify
    region: oregon
    runtime: node
    # starter (always-on), not free: a free instance spins down after ~15 min
    # idle and the first tap on a texted/emailed link would wait ~30 s.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build # NODE_ENV=production would otherwise skip devDependencies (tsc, vite)
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: ht-ai-verify-db, property: connectionString }
      # Render assigns https://<name>.onrender.com deterministically from the name above.
      - key: PUBLIC_URL
        value: 'https://ht-ai-verify.onrender.com'
      - key: ADMIN_PASSWORD
        sync: false # console password (empty = open console; set one for anything shared)
      - key: AGENCY_NAME
        value: Healthy Together
      - key: STATE_CODE
        value: TN
      - key: ENABLE_DEMO_SEED
        value: 'true'
      # --- AI first-pass document review (OpenAI vision) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_OCR_MODEL
        value: gpt-4o
      # --- SMS (household links) ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # --- Email (provider links): set EMAIL_VENDOR=resend + RESEND_API_KEY + EMAIL_FROM to deliver;
      #     unset → the console shows the link for manual sharing ---
      - key: EMAIL_VENDOR
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # --- CLEAR identity: 'sandbox' + creds, or unset → labelled simulation ---
      - key: CLEAR_MODE
        sync: false
      - key: CLEAR_API_KEY
        sync: false
      - key: CLEAR_PROJECT_ID
        sync: false
      # DEMO ONLY — CLEAR's sandbox returns its own test identity; present the requested name. Never on a real deployment.
      - key: CLEAR_DEMO_NAME_MATCH
        value: 'true'
      # DEMO ONLY — coverage CLEAR "discovers" for households: active New York Medicaid (out of state for TN). Never on a real deployment.
      - key: CLEAR_DEMO_COVERAGE
        value: 'medicaid'
      - key: CLEAR_DEMO_COVERAGE_STATE
        value: 'NY'
      # --- Argyle payroll/bank: sandbox creds, or unset → labelled simulation ---
      - key: ARGYLE_API_BASE
        value: 'https://api-sandbox.argyle.com/v2'
      - key: ARGYLE_API_KEY_ID
        sync: false
      - key: ARGYLE_API_KEY_SECRET
        sync: false
